[project]
name = "seqtante_open"
dynamic = ["version"]
description = "Fundamental package for fast calibration of quantum chips."
authors = [{name = "Qilimanjaro Quantum Tech", email = "info@qilimanjaro.tech"}]
urls = {Repository = "https://github.com/qilimanjaro-tech/seqtante-open"}
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11, <3.14"
keywords = ["quantum control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "qililab >= 0.35.2, < 0.36",
    "kaleido>=1.2.0",
    "lmfit>=1.3.2",
    "loguru>=0.7.3",
    "networkx>=3.1",
    "numpy>=1.26",
    "plotly>=6.0.0",
    "pyyaml>=6.0.2",
    "qcodes",
    "ruamel-yaml>=0.18.10",
    "scipy>=1.15",
    "xarray>=2024.7.0",
]

[dependency-groups]
dev = [
    "mdformat>=0.7.22",
    "mdformat-ruff>=0.1.3",
    "nbqa>=1.9.1",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.11.2",
    "h5py>=3.13.0",
    "towncrier>=25.8.0",
    "ty>=0.0.34",
]

docs = [
    "sphinx>=8.1.3",
    "sphinx-automodapi>=0.18.0",
    "sphinx-design>=0.6.1",
    "sphinx-mdinclude>=0.6.2",
    "sphinxawesome-theme>=6.0.0b1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from git: a release tag such as `0.1.2` builds as `0.1.2`, and each commit
# after it builds as a development version such as `0.1.3.dev2+g1a2b3c4`, where 2 counts the
# commits on main's first-parent line since the tag (one per merged pull request, merge commit
# or squash). Only bare `MAJOR.MINOR.PATCH` tags count.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options.scm.git]
describe_command = [
    "git", "describe", "--dirty", "--tags", "--long", "--first-parent",
    "--match", "[0-9]*.[0-9]*.[0-9]*", "--exclude", "*[!0-9.]*",
]


[tool.uv]
required-version = ">=0.13.8"
preview-features = ["build-dependency-hashes"]
require-build-hashes = true
# Complete wheel-only build closure for hatchling/hatch-vcs and the reviewed Qblox exception.
build-constraint-dependencies = [
    { requirement = "editables==0.5", hashes = ["sha256:61e5ffa82629e0d8bfe09bc44a07db3c1ab8ed1ce78a6980732870f19b5e7d4c"] },
    { requirement = "hatch-vcs==0.5.0", hashes = ["sha256:b49677dbdc597460cc22d01b27ab3696f5e16a21ecf2700fb01bc28e1f2a04a7"] },
    { requirement = "hatchling==1.33.0", hashes = ["sha256:415290b84f464d2884303fca8974d38e7b85579069fab02a15db0828fbb1446d"] },
    { requirement = "packaging==26.3", hashes = ["sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c"] },
    { requirement = "pathspec==1.1.1", hashes = ["sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189"] },
    { requirement = "pluggy==1.7.0", hashes = ["sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec"] },
    { requirement = "setuptools==84.2.1", hashes = ["sha256:ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2"] },
    { requirement = "setuptools-scm==10.3.4", hashes = ["sha256:82f34c3e3084fc2b57d397200637cc13f2338004052d2fee47baa5f0e902464e"] },
    { requirement = "tomlkit==0.15.2", hashes = ["sha256:05562412163a3037b94497385fb7f9204c637bc605af7a48199e41cf2272f437"] },
    { requirement = "trove-classifiers==2026.9.21.13", hashes = ["sha256:8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17"] },
    { requirement = "vcs-versioning==2.6.0", hashes = ["sha256:f8bebd1302ebc12e67ceb30fc7dd698ec969414b6fa43b30c3f14ac9b1e72c41"] },
]
keyring-provider = "subprocess"

[[tool.uv.index]]
name = "qilimanjaro"
url = "https://aws@qilimanjaro-723412851021.d.codeartifact.eu-west-1.amazonaws.com/pypi/qilimanjaro/simple"

[tool.uv.sources]
qililab = { index = "qilimanjaro" }
qpysequence = { index = "qilimanjaro" }

[tool.ruff]
line-length = 120
output-format = "concise"

[tool.ruff.lint]
preview = true
select = [
    "F",
    "E",
    "W",
    "I",
    "YTT",
    # "ANN",
    "ASYNC",
    "S",
    "BLE",
    "CPY",
    "C4",
    # "DTZ",
    "T10",
    "FA",
    "ICN",
    "LOG",
    "G",
    "INP",
    "PIE",
    "T20",
    # "PYI",
    # "PT",
    "Q",
    "RSE",
    "RET",
    # "SLF",
    "SLOT",
    # "SIM",
    "TID",
    "TC",
    # "PTH",
    # "TD",
    # "PL",
    # "NPY",
    # "FURB",
    # "DOC",
    "RUF"
]
ignore = [
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "line-too-long",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "single-line-implicit-string-concatenation",
    "multi-line-implicit-string-concatenation",
    "ambiguous-variable-name",
    "tab-indentation",
    "unnecessary-assign",
    "multiple-with-statements",
    "useless-import-alias",
    "import-private-name",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-positional-arguments",
    "too-many-nested-blocks"]
dummy-variable-rgx = "^_$"
logger-objects = ["qililab.logger"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "CPY", "private-member-access", "PLR", "DOC", "mutable-class-default"]
"docs/*" = ["CPY"]
"examples/*" = ["CPY", "T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
ignore-names = ["test_*"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"qililab" = "ql"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ty.src]
exclude = [
    "**/*.ipynb",
    "tests/",
]

[tool.towncrier]
package = "seqtante_open"
directory = "changes"
filename = "CHANGELOG.md"
issue_format = "[PR #{issue}](https://github.com/qilimanjaro-tech/seqtante-open/pull/{issue})"

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = true

[tool.coverage]
    [tool.coverage.report]
    show_missing = true
    exclude_lines = [
        # Have to re-enable the standard pragma
        "pragma: no cover",

        # Don"t complain about missing debug-only code:
        "def __repr__",
        "if self.debug",

        # Don"t complain if tests don"t hit defensive assertion code:
        "raise AssertionError",
        "raise NotImplementedError",

        # Don"t complain if non-runnable code isn"t run:
        "if 0:",
        "if __name__ == .__main__.:",

        # Don"t complain if TYPE_CHECKING is used:
        "if TYPE_CHECKING:"
    ]
    omit = [
        "env/*",
        "venv/*",
        "*/virtualenv/*",
        "*/virtualenvs/*",
        "*/tests/*",
        "examples/*",
    ]

[tool.nbqa.md]
mdformat = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
