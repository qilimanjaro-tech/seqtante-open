name: Release tools

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  release-tools:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.13.8"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked tools and test dependencies
        run: uv sync --project .github/release-tools --locked --no-build --no-default-groups --group test
      - name: Verify release installation and publication commands
        run: .github/release-tools/.venv/bin/python -m unittest discover -s .github/release-tools -v
